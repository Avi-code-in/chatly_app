name: chatly_app
description: A simple real-time chat app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.4.4
  image_picker: ^1.2.4
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^22.3.2
  emoji_picker_flutter: ^4.5.4
  file_picker: ^13.1.0
  flutter_contacts: ^2.1.0
  country_code_picker: ^3.4.1
  google_sign_in: ^7.2.0
  google_fonts: ^8.2.1
  share_plus: ^13.3.1
  uuid: ^4.6.0
  cloudinary_public: ^0.23.1
  video_player: ^2.11.1
  video_compress: ^3.1.4
  path_provider: ^2.1.6
  record: ^6.2.1
  just_audio: ^0.10.6
  permission_handler: ^13.0.2
  geolocator: ^14.0.1
  geocoding: ^5.0.0
  speech_to_text: ^7.4.0
  local_auth: ^3.0.2
  qr_flutter: ^4.1.0
  qr_code_scanner: ^1.0.1
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  archive: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.jpg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon.jpg"
