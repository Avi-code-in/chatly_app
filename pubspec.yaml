name: chatly_app
description: A simple real-time chat app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.4.4
  image_picker: ^1.2.4
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^22.3.2
  emoji_picker_flutter: ^4.5.4
  file_picker: ^13.1.0
  flutter_contacts: ^2.1.0
  country_code_picker: ^3.4.1
  google_sign_in: ^7.2.0
  google_fonts: ^8.2.1
  share_plus: ^13.3.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.jpg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon.jpg"
